name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The examples build against the compiler's develop, so a compiler change can break them without
  # anything being pushed here. Run daily so that shows up on its own.
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The branch of souther-lang/souther the examples are built against.
  SOUTHER_REF: develop

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Souther version is declared in the Maven build, the Clojure account example's deps.edn,
      # and the README snippet. This fails if a bump touched some but not all of them.
      - name: Check version consistency
        run: bin/check-version-consistency.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # souther.version is a -SNAPSHOT that is published nowhere, so the compiler is built from
      # source and installed into ~/.m2 before the examples can resolve it.
      - name: Check out the compiler
        uses: actions/checkout@v7
        with:
          repository: souther-lang/souther
          ref: ${{ env.SOUTHER_REF }}
          path: souther

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install the compiler
        run: mvn -B --no-transfer-progress -f souther/pom.xml install -DskipTests

      - name: Build and test the examples
        run: mvn -B --no-transfer-progress verify

  account:
    # The Clojure example is not a Maven module, so `mvn verify` does not reach it; its .sou is
    # generated and checked by the :gen alias instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the compiler
        uses: actions/checkout@v7
        with:
          repository: souther-lang/souther
          ref: ${{ env.SOUTHER_REF }}
          path: souther

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install the compiler
        run: mvn -B --no-transfer-progress -f souther/pom.xml install -DskipTests

      - name: Install Clojure
        run: |
          curl -fsSL -o linux-install.sh https://download.clojure.org/install/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Generate and test
        working-directory: account
        run: |
          clojure -X:gen
          clojure -X:test

  issuetracker:
    # The Kotlin example is built with Gradle, so `mvn verify` does not reach it either. `build`
    # generates from its .sou, compiles the Kotlin boundary against the generated types, and runs the
    # tests — which start Boot and drive every route over HTTP against H2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the compiler
        uses: actions/checkout@v7
        with:
          repository: souther-lang/souther
          ref: ${{ env.SOUTHER_REF }}
          path: souther

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # souther-compiler is resolved from ~/.m2 (settings.gradle.kts lists mavenLocal first), so it is
      # installed the same way the Maven examples get it.
      - name: Install the compiler
        run: mvn -B --no-transfer-progress -f souther/pom.xml install -DskipTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        working-directory: issuetracker
        run: ./gradlew build --no-daemon
