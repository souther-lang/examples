name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Souther version is declared in the Maven build, the Clojure account example's deps.edn,
      # the Kotlin example's build.gradle.kts, and the README snippet. This fails if a bump touched
      # some but not all of them.
      - name: Check version consistency
        run: bin/check-version-consistency.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # souther.version is a release on Maven Central, so nothing is built from source first.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test the examples
        run: mvn -B --no-transfer-progress verify

  account:
    # The Clojure example is not a Maven module, so `mvn verify` does not reach it; its .sou is
    # generated and checked by the :gen alias instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Clojure
        run: |
          curl -fsSL -o linux-install.sh https://download.clojure.org/install/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      - name: Generate and test
        working-directory: account
        run: |
          clojure -X:gen
          clojure -X:test

  issuetracker:
    # The Kotlin example is built with Gradle, so `mvn verify` does not reach it either. `build`
    # generates from its .sou, compiles the Kotlin boundary against the generated types, and runs the
    # tests — which start Boot and drive every route over HTTP against H2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        working-directory: issuetracker
        run: ./gradlew build --no-daemon
