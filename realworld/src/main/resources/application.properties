# H2 in-memory. DB_CLOSE_DELAY=-1 keeps the DB alive for as long as the JVM does.
spring.datasource.url=jdbc:h2:mem:realworld;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql (DDL) on startup.
spring.sql.init.mode=always

# The HS256 signing key for the JWTs the boundary issues. HS256 needs at least 32 bytes. This is an
# example, and the value is in the repository: a deployment overrides it with REALWORLD_JWT_SECRET.
realworld.jwt.secret=${REALWORLD_JWT_SECRET:a-development-only-signing-key-32-bytes-plus}
